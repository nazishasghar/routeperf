# GoReleaser: `git tag v0.1.0 && git push --tags` → the release workflow publishes binaries.
version: 2
project_name: routeperf
builds:
  - main: ./cmd/routeperf
    binary: routeperf
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X {{ .ModulePath }}/internal/version.Version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.Commit={{ .ShortCommit }} -X {{ .ModulePath }}/internal/version.Date={{ .Date }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - name_template: "routeperf_{{ .Os }}_{{ .Arch }}"   # stable names → install.sh can use /releases/latest/download
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, routeperf.example.yaml]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
# Homebrew tap: publishes a cask to github.com/nazishasghar/homebrew-tap when the
# HOMEBREW_TAP_GITHUB_TOKEN secret (a token that can push to that repo) is set;
# otherwise the step is skipped. Users: brew install nazishasghar/tap/routeperf
homebrew_casks:
  - name: routeperf
    repository:
      owner: nazishasghar
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    directory: Casks
    homepage: https://github.com/nazishasghar/routeperf
    description: Per-endpoint performance and Big O from an OpenAPI, GraphQL or gRPC API plus EXPLAIN ANALYZE
    license: MIT
    commit_author:
      name: routeperf-release
      email: routeperf-release@users.noreply.github.com
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/routeperf"]
          end
