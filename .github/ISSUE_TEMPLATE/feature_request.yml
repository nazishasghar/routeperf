name: Feature request
description: Something routeperf should measure, detect or support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out about your API, and where does routeperf fall short today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work: a flag, a report section, a new check.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Database, API style (OpenAPI/GraphQL/gRPC), framework/ORM, where it runs.
